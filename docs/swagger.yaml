basePath: /api
definitions:
  gin.H:
    additionalProperties: {}
    type: object
  models.AuditLog:
    properties:
      action:
        type: string
      correlation_id:
        type: string
      created_at:
        type: string
      details:
        type: string
      id:
        type: string
      ip_address:
        type: string
      resource:
        type: string
      result:
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      user_agent:
        type: string
      user_id:
        type: string
    type: object
  models.BlogPost:
    properties:
      author:
        $ref: '#/definitions/models.User'
      author_id:
        type: string
      category:
        type: string
      content:
        type: string
      created_at:
        type: string
      excerpt:
        type: string
      id:
        type: string
      image:
        type: string
      published_at:
        type: string
      read_time:
        type: integer
      slug:
        type: string
      status:
        description: draft, published, archived
        type: string
      tags:
        description: JSON string of tags
        type: string
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  models.Session:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      token:
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      user_id:
        type: string
    type: object
  models.SupportTicket:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      priority:
        type: string
      status:
        type: string
      subject:
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      user_id:
        type: string
    type: object
  models.Transaction:
    properties:
      amount:
        type: number
      counterparty_wallet:
        $ref: '#/definitions/models.Wallet'
      counterparty_wallet_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      idempotency_key:
        type: string
      metadata:
        type: string
      reference_id:
        type: string
      status:
        type: string
      type:
        description: deposit, withdrawal, transfer_in, transfer_out
        type: string
      updated_at:
        type: string
      wallet:
        allOf:
        - $ref: '#/definitions/models.Wallet'
        description: Relationships
      wallet_id:
        type: string
    type: object
  models.User:
    properties:
      audit_logs:
        items:
          $ref: '#/definitions/models.AuditLog'
        type: array
      avatar:
        type: string
      bio:
        type: string
      blog_posts:
        items:
          $ref: '#/definitions/models.BlogPost'
        type: array
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_admin:
        type: boolean
      name:
        type: string
      sessions:
        items:
          $ref: '#/definitions/models.Session'
        type: array
      support_tickets:
        items:
          $ref: '#/definitions/models.SupportTicket'
        type: array
      title:
        type: string
      two_factor_enabled:
        type: boolean
      updated_at:
        type: string
      username:
        type: string
      wallets:
        description: Relationships
        items:
          $ref: '#/definitions/models.Wallet'
        type: array
    type: object
  models.Wallet:
    properties:
      balance:
        type: number
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      transactions:
        items:
          $ref: '#/definitions/models.Transaction'
        type: array
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      user_id:
        type: string
      version:
        type: integer
    type: object
  routes.DeleteAccountRequest:
    properties:
      confirm:
        type: string
      password:
        type: string
    required:
    - confirm
    - password
    type: object
  routes.DepositRequest:
    properties:
      amount:
        type: number
      description:
        type: string
    required:
    - amount
    type: object
  routes.Disable2FARequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  routes.Enable2FARequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  routes.Login2FARequest:
    properties:
      code:
        type: string
      recovery_code:
        type: string
      user_id:
        type: string
    required:
    - user_id
    type: object
  routes.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  routes.PasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  routes.PasswordVerifyRequest:
    properties:
      email:
        type: string
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - email
    - new_password
    - token
    type: object
  routes.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  routes.ReplyRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  routes.SupportTicketRequest:
    properties:
      message:
        type: string
      priority:
        type: string
      subject:
        type: string
    required:
    - message
    - priority
    - subject
    type: object
  routes.Token:
    properties:
      access_token:
        type: string
      token_type:
        type: string
    type: object
  routes.TokenPairResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  routes.TransferRequest:
    properties:
      amount:
        type: number
      description:
        type: string
      recipient:
        type: string
    required:
    - amount
    - recipient
    type: object
  routes.UserCreate:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  routes.UserLogin:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  routes.Verify2FARequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
host: localhost:8080
info:
  contact: {}
  description: Secure digital banking platform with JWT authentication, TOTP 2FA,
    multi-currency wallets, atomic transfers, and admin monitoring
  title: SecureWallet API
  version: 1.0.0
paths:
  /2fa/disable:
    post:
      consumes:
      - application/json
      description: Disable TOTP two-factor authentication for the authenticated user
      parameters:
      - description: 2FA disable data with TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.Disable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Disable 2FA
      tags:
      - 2fa
  /2fa/enable:
    post:
      consumes:
      - application/json
      description: Enable TOTP two-factor authentication for the authenticated user
      parameters:
      - description: 2FA enable data with TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.Enable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Enable 2FA
      tags:
      - 2fa
  /2fa/recovery-codes:
    get:
      consumes:
      - application/json
      description: Get the count of remaining unused recovery codes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Get recovery codes count
      tags:
      - 2fa
  /2fa/recovery-codes/generate:
    post:
      consumes:
      - application/json
      description: Generate new TOTP recovery codes for the authenticated user (requires
        2FA enabled)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Generate recovery codes
      tags:
      - 2fa
  /2fa/status:
    get:
      consumes:
      - application/json
      description: Get the 2FA enrollment status for the authenticated user. Returns
        QR code URL if not yet enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Get 2FA status
      tags:
      - 2fa
  /2fa/verify:
    post:
      consumes:
      - application/json
      description: Verify a TOTP code for the authenticated user
      parameters:
      - description: TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Verify 2FA code
      tags:
      - 2fa
  /admin/dashboard:
    get:
      consumes:
      - application/json
      description: Get admin dashboard overview
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Admin dashboard
      tags:
      - admin
  /admin/settings:
    get:
      consumes:
      - application/json
      description: Get current system configuration settings (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Get system settings
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Update system configuration settings (admin only)
      parameters:
      - description: Settings data
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Save system settings
      tags:
      - admin
  /admin/support/tickets:
    get:
      consumes:
      - application/json
      description: Get all support tickets for admin review
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/gin.H'
            type: array
      security:
      - BearerAuth: []
      summary: Admin list support tickets
      tags:
      - admin
  /admin/support/tickets/{id}/reply:
    post:
      consumes:
      - application/json
      description: Add a reply to a support ticket (admin only)
      parameters:
      - description: Ticket ID
        in: path
        name: id
        required: true
        type: string
      - description: Reply message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.ReplyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Reply to support ticket
      tags:
      - admin
  /admin/support/tickets/{id}/resolve:
    post:
      consumes:
      - application/json
      description: Mark a support ticket as resolved (admin only)
      parameters:
      - description: Ticket ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Resolve support ticket
      tags:
      - admin
  /admin/transactions:
    get:
      consumes:
      - application/json
      description: Get all system-wide transactions for admin monitoring
      parameters:
      - default: 100
        description: Number of transactions to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/gin.H'
            type: array
      security:
      - BearerAuth: []
      summary: Admin list transactions
      tags:
      - admin
  /admin/users:
    get:
      consumes:
      - application/json
      description: Get all users for admin management
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Admin list users
      tags:
      - admin
  /admin/users/{id}/disable:
    post:
      consumes:
      - application/json
      description: Disable a user account (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Disable user
      tags:
      - admin
  /admin/users/{id}/enable:
    post:
      consumes:
      - application/json
      description: Enable a previously disabled user account (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Enable user
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with username and password
      parameters:
      - description: User login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/routes.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.Token'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
      summary: Login user
      tags:
      - auth
  /auth/login/2fa:
    post:
      consumes:
      - application/json
      description: Verify TOTP code or recovery code to complete login after initial
        authentication
      parameters:
      - description: 2FA verification data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.Login2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.TokenPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
      summary: Verify 2FA code during login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout current user session. If a refresh_token is provided, it
        will be revoked.
      parameters:
      - description: Optional refresh token to revoke
        in: body
        name: body
        schema:
          $ref: '#/definitions/routes.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      summary: Logout user
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get current authenticated user information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - ApiKeyAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: Request a password reset link for the given email address
      parameters:
      - description: Email for password reset
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      summary: Request password reset
      tags:
      - auth
  /auth/password-verify:
    post:
      consumes:
      - application/json
      description: Reset password using the token received via email
      parameters:
      - description: Password reset verification data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.PasswordVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      summary: Complete password reset
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Refresh access token using a valid refresh token. Implements token
        rotation: the old refresh token is invalidated and a new one is issued.'
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.TokenPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
      summary: Refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account with username, email, and password
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/routes.UserCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gin.H'
      summary: Register a new user
      tags:
      - auth
  /backup:
    get:
      consumes:
      - application/json
      description: List all available database backups
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: List backups
      tags:
      - backup
  /backup/{filename}:
    get:
      consumes:
      - application/json
      description: Get information about a specific backup file
      parameters:
      - description: Backup filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Get backup info
      tags:
      - backup
  /backup/config:
    get:
      consumes:
      - application/json
      description: Get backup configuration settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Get backup config
      tags:
      - backup
  /backup/stats:
    get:
      consumes:
      - application/json
      description: Get backup statistics and metadata
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Get backup stats
      tags:
      - backup
  /data/clear-sample:
    delete:
      consumes:
      - application/json
      description: Clear all sample data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Clear sample data
      tags:
      - data
  /data/force-recreate:
    post:
      consumes:
      - application/json
      description: Completely drop and recreate the database (use when schema incompatibility
        issues occur)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Force database recreation
      tags:
      - data
  /data/init-db:
    post:
      consumes:
      - application/json
      description: Initialize database tables using GORM auto-migration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      summary: Initialize database tables
      tags:
      - data
  /data/reset-database:
    post:
      consumes:
      - application/json
      description: Clear all data, initialize database, and create sample data
      produces:
      - application/json
      responses:
        "200":
          description: OK
